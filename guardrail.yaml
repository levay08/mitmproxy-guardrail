# guardrail.yaml - settings for the local guardrail.
# Edit, save, then restart the guardrail.

providers:
  # Test media only: these are what the armed pass inspects and exercises.
  # The working tools (Claude, DeepSeek, the local Hermes provider) are deliberately NOT here:
  # mitmproxy's allow_hosts is an interception scope, so anything listed can be masked AND blocked.
  #
  # Anthropic added 4 Oct 2026: leaving it out is what let an SSH password and an AWS key reach
  # Claude in clear. In neutral mode (the shipped default) external rules warn and never block and
  # no dlp rule declares action: block, so listing it buys masking without risking a 403 on the
  # owner's working tool. Switching mode to persistent makes external rules enforce, so re-read
  # this line before doing that.
  - api\.anthropic\.com
  - console\.anthropic\.com
  - statsig\.anthropic\.com
  # Browser chat UIs, added 4 Oct 2026. The PAC is built from this list, so a web
  # host missing here is never proxied and its prompt leaves in clear: that is how
  # chat.z.ai produced zero audit records while the owner was testing it.
